<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>재경관리사 오답노트</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#faf9f6;color:#202124;font-family:-apple-system,"Apple SD Gothic Neo",sans-serif}
.wrap{max-width:700px;margin:auto;padding:28px 16px 70px}
h1{margin:0;font-size:27px}
.sub{color:#777;margin:6px 0 22px}
.stats,.filters,.tools,.review{display:flex;gap:7px}
.stats{margin-bottom:16px}
button{font-family:inherit;cursor:pointer}
.stat{flex:1;padding:11px 5px;text-align:center;border:1px solid #ddd;border-radius:13px;background:white;font-size:13px}
.stat b{display:block;font-size:19px;margin-top:3px}
.stat.on,.filters .on,#quiz.on{background:#202124;color:white;border-color:#202124}
#q{width:100%;padding:13px 15px;border:1.5px solid #ccc;border-radius:13px;font-size:16px;margin-bottom:11px;outline:none}
#q:focus{border-color:#356ae6}
.filters{overflow:auto;margin:5px 0 16px;padding-bottom:3px}
.filters button{white-space:nowrap;border:1px solid #ccc;background:white;padding:8px 11px;border-radius:20px;font-weight:650}
.tools{align-items:center;justify-content:space-between;margin:5px 0 16px;font-size:13px}
#quiz{padding:10px 13px;border:1px solid #ccc;border-radius:12px;background:white;font-weight:700}
.tools label{display:flex;align-items:center;gap:5px;color:#555}
.tools input{accent-color:#202124}
.card{background:white;border:1px solid #ddd;border-radius:14px;margin:9px 0;overflow:hidden}
.card.known{background:#f0f0f0;border-color:#ccc}
.head{padding:14px;cursor:pointer}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.meta{font-size:12px;font-weight:700;margin-bottom:5px}
.암기{color:#d9343a}.공식{color:#1769d2}.이해{color:#16844b}
.fire{color:#e05a22}
.title{font-size:16px;font-weight:750}
.key{font-size:14px;color:#555;margin-top:7px;line-height:1.55}
.detail{display:none;border-top:1px solid #eee;padding:13px 14px;line-height:1.65;font-size:14px;white-space:pre-line}
.card.open .detail{display:block}
.round{margin-top:10px;color:#777;font-size:12px}
.badge{font-size:11px;font-weight:750;padding:5px 8px;border-radius:20px;white-space:nowrap}
.badge.미평가{background:#eee;color:#777}
.badge.모름{background:#ffe8e8;color:#c83232}
.badge.헷갈림{background:#fff2d5;color:#a66b00}
.badge.알겠음{background:#e0f3e6;color:#16844b}
.review{padding:0 14px 13px}
.grade{flex:1;padding:9px 4px;border:1px solid #ddd;background:white;border-radius:9px;font-size:12px;font-weight:700}
.grade.active[data-grade="모름"]{background:#ffe8e8;border-color:#e16b6b;color:#b52828}
.grade.active[data-grade="헷갈림"]{background:#fff2d5;border-color:#e5b84e;color:#996000}
.grade.active[data-grade="알겠음"]{background:#e0f3e6;border-color:#69ba83;color:#147b39}
.card.quiz:not(.open) .key,.card.quiz:not(.open) .review{display:none}
.hint{display:none;color:#999;font-size:12px;margin-top:10px}
.card.quiz:not(.open) .hint{display:block}
@media(max-width:420px){.wrap{padding:22px 12px 60px}.grade{font-size:11px}}
</style>
</head>
<body>
<div class="wrap">
<h1>📚 재경관리사 오답노트</h1>
<div class="sub">헷갈리는 것만 빠르게 다시 보기</div>

<div class="stats" id="stats">
<button class="stat on" data-v="전체">전체<b id="all">0</b></button>
<button class="stat" data-v="재무회계">재무<b id="a">0</b></button>
<button class="stat" data-v="세무회계">세무<b id="b">0</b></button>
<button class="stat" data-v="원가관리회계">원가<b id="c">0</b></button>
</div>

<input id="q" placeholder="🔎 개념·핵심·풀이 검색">

<div class="tools">
<button id="quiz">🧠 암기 테스트 OFF</button>
<label><input type="checkbox" id="weak" checked> 취약 카드 먼저</label>
</div>

<div class="filters" id="types">
<button class="on" data-v="전체">전체 유형</button>
<button data-v="암기">🔴 암기</button>
<button data-v="공식">🔵 공식</button>
<button data-v="이해">🟢 이해</button>
</div>

<div class="filters" id="statuses">
<button class="on" data-v="전체">전체 상태</button>
<button data-v="미평가">⚪ 미평가</button>
<button data-v="모름">🔴 모름</button>
<button data-v="헷갈림">🟡 헷갈림</button>
<button data-v="알겠음">🟢 알겠음</button>
</div>

<div id="list"></div>
</div>

<script>
document.write('<script src="data.js?v='+Date.now()+'"><\/script>');
</script>
<script>
const $=s=>document.querySelector(s);
const subject=x=>x.s==="원가회계"?"원가관리회계":x.s;
const cards=[...new Map(wrongAnswers.map(x=>[JSON.stringify(x),x])).values()];
const idFor=x=>JSON.stringify([subject(x),x.t,x.r]);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

let S="전체",T="전체",V="전체",quiz=false;
let review=JSON.parse(localStorage.getItem("wrongReviewV1")||"{}");
const old=JSON.parse(localStorage.getItem("wrongKnownV1")||"{}");
const opened=new Set();
const priority={"모름":0,"헷갈림":1,"미평가":2,"알겠음":3};
const state=id=>review[id]||"미평가";
const save=()=>localStorage.setItem("wrongReviewV1",JSON.stringify(review));

Object.keys(old).forEach(id=>{
 if(old[id]&&!review[id])review[id]="알겠음";
});
save();

["전체","재무회계","세무회계","원가관리회계"].forEach((s,i)=>{
 $("#"+["all","a","b","c"][i]).textContent=
 s==="전체"?cards.length:cards.filter(x=>subject(x)===s).length;
});

function draw(){
 const z=$("#q").value.toLowerCase();
 let result=cards.filter(x=>{
  const id=idFor(x);
  return (S==="전체"||subject(x)===S)
   &&(T==="전체"||x.y===T)
   &&(V==="전체"||state(id)===V)
   &&(x.t+x.k+x.d+x.r.join(" ")).toLowerCase().includes(z);
 });

 if($("#weak").checked)
  result.sort((a,b)=>priority[state(idFor(a))]-priority[state(idFor(b))]);

 $("#list").innerHTML=result.map(x=>{
  const id=idFor(x),code=encodeURIComponent(id),st=state(id);
  return `<div class="card ${st==="알겠음"?"known":""} ${opened.has(id)?"open":""} ${quiz?"quiz":""}" data-id="${code}">
   <div class="head">
    <div class="top">
     <div class="meta ${esc(x.y)}">${esc(x.y)} · ${esc(subject(x))}
      ${x.r.length>1?`<span class="fire">🔥 ${x.r.length}회</span>`:""}
     </div>
     <span class="badge ${st}">${st}</span>
    </div>
    <div class="title">${esc(x.t)}</div>
    <div class="key">${esc(x.k)}</div>
    <div class="hint">눌러서 정답 확인하기 ↓</div>
   </div>
   <div class="detail">${esc(x.d)}
    <div class="round">출제: ${esc(x.r.join(" · "))}</div>
   </div>
   <div class="review">
    ${["모름","헷갈림","알겠음"].map((g,i)=>
     `<button class="grade ${st===g?"active":""}" data-grade="${g}" data-id="${code}">
      ${["🔴","🟡","🟢"][i]} ${g}</button>`
    ).join("")}
   </div>
  </div>`;
 }).join("")||"<p>검색 결과가 없어 👀</p>";
}

$("#list").onclick=e=>{
 const btn=e.target.closest(".grade");
 if(btn){
  const id=decodeURIComponent(btn.dataset.id),g=btn.dataset.grade;
  review[id]=state(id)===g?"미평가":g;
  opened.delete(id);
  save();draw();return;
 }
 const card=e.target.closest(".card");
 if(!card)return;
 const id=decodeURIComponent(card.dataset.id);
 opened.has(id)?opened.delete(id):opened.add(id);
 draw();
};

function filter(group,set){
 document.querySelectorAll(`#${group} button`).forEach(b=>{
  b.onclick=()=>{
   document.querySelectorAll(`#${group} button`).forEach(x=>x.classList.remove("on"));
   b.classList.add("on");
   set(b.dataset.v);draw();
  };
 });
}
filter("stats",v=>S=v);
filter("types",v=>T=v);
filter("statuses",v=>V=v);

$("#q").oninput=draw;
$("#weak").onchange=draw;
$("#quiz").onclick=()=>{
 quiz=!quiz;opened.clear();
 $("#quiz").classList.toggle("on",quiz);
 $("#quiz").textContent=`🧠 암기 테스트 ${quiz?"ON":"OFF"}`;
 draw();
};
draw();
</script>
</body>
</html>
