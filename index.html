<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>재경관리사 오답노트</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#faf9f6;color:#202124;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}.wrap{max-width:700px;margin:auto;padding:28px 16px 70px}h1{margin:0;font-size:27px}.sub{color:#777;margin:6px 0 22px}.stats{display:flex;gap:8px;margin-bottom:16px}.stat{flex:1;background:#fff;border:1px solid #ddd;border-radius:13px;padding:11px;text-align:center;font-size:13px}.stat b{display:block;font-size:19px;margin-top:3px}input{width:100%;padding:13px 15px;border:1.5px solid #ccc;border-radius:13px;background:#fff;font-size:16px;outline:none;margin-bottom:11px}input:focus{border-color:#356ae6}.filters{display:flex;gap:7px;overflow:auto;margin:5px 0 16px;padding-bottom:3px}.filters button{white-space:nowrap;border:1px solid #ccc;background:#fff;padding:8px 11px;border-radius:20px;font-weight:650}.filters button.on{background:#202124;color:#fff;border-color:#202124}.card{background:#fff;border:1px solid #ddd;border-radius:14px;margin:9px 0;overflow:hidden}.head{padding:14px;cursor:pointer}.meta{font-size:12px;font-weight:700;margin-bottom:5px}.암기{color:#d9343a}.공식{color:#1769d2}.이해{color:#16844b}.title{font-size:16px;font-weight:750}.key{font-size:14px;color:#555;margin-top:5px}.detail{display:none;border-top:1px solid #eee;padding:13px 14px;line-height:1.65;font-size:14px}.card.open .detail{display:block}.round{margin-top:10px;color:#777;font-size:12px}.fire{float:right;color:#e05a22}
</style>
</head>
<body>
<div class="wrap">
<h1>📚 재경관리사 오답노트</h1>
<div class="sub">헷갈리는 것만 빠르게 다시 보기</div>

<div class="stats">
 <div class="stat">재무<b id="a">0</b></div>
 <div class="stat">세무<b id="b">0</b></div>
 <div class="stat">원가<b id="c">0</b></div>
</div>

<input id="q" placeholder="🔎 개념·핵심·풀이 검색">

<div class="filters" id="subjects">
 <button class="on" data-v="전체">전체</button>
 <button data-v="재무회계">재무</button>
 <button data-v="세무회계">세무</button>
 <button data-v="원가관리회계">원가</button>
</div>

<div class="filters" id="types">
 <button class="on" data-v="전체">전체 유형</button>
 <button data-v="암기">🔴 암기</button>
 <button data-v="공식">🔵 공식</button>
 <button data-v="이해">🟢 이해</button>
</div>

<div id="list"></div>
</div>

<script src="data.js"></script>
<script>
let S="전체",T="전체";
const $=x=>document.querySelector(x);
a.textContent=wrongAnswers.filter(x=>x.s=="재무회계").length;
b.textContent=wrongAnswers.filter(x=>x.s=="세무회계").length;
c.textContent=wrongAnswers.filter(x=>x.s=="원가관리회계").length;

function draw(){
 let z=q.value.toLowerCase();
 list.innerHTML=wrongAnswers.filter(x=>
  (S=="전체"||x.s==S)&&(T=="전체"||x.y==T)&&
  (x.t+x.k+x.d+x.r.join(" ")).toLowerCase().includes(z)
 ).map((x,i)=>`
 <div class="card" onclick="this.classList.toggle('open')">
  <div class="head">
   <div class="meta ${x.y}">${x.y} · ${x.s}
   ${x.r.length>1?`<span class="fire">🔥 ${x.r.length}회</span>`:""}</div>
   <div class="title">${x.t}</div>
   <div class="key">${x.k}</div>
  </div>
  <div class="detail">${x.d}<div class="round">출제: ${x.r.join(" · ")}</div></div>
 </div>`).join("")||"<p>검색 결과가 없어 👀</p>"
}

function buttons(id,set){
 document.querySelectorAll("#"+id+" button").forEach(x=>x.onclick=()=>{
  document.querySelectorAll("#"+id+" button").forEach(y=>y.classList.remove("on"));
  x.classList.add("on");set(x.dataset.v);draw()
 })
}
buttons("subjects",v=>S=v);
buttons("types",v=>T=v);
q.oninput=draw;
draw();
</script>
</body>
</html>
